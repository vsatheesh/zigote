name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
      - name: Run tests (debug)
        run: zig build test --summary line
      - name: Run tests (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast --summary line

